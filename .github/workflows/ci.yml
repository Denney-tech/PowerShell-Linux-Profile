---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning, Error
          $results | Format-Table -AutoSize -Wrap ScriptName, Line, Severity, RuleName, Message
          foreach ($r in $results) {
            "::$($r.Severity -eq 'Error' ? 'error' : 'warning') file=$($r.ScriptPath | Resolve-Path -Relative),line=$($r.Line)::$($r.RuleName): $($r.Message)"
          }
          if ($results) { throw "PSScriptAnalyzer reported $($results.Count) issue(s)" }

  test:
    name: Module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install carapace (for the completion tests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/carapace" && cd "$RUNNER_TEMP/carapace"
          gh release download --repo carapace-sh/carapace-bin \
            --pattern '*_linux_amd64.tar.gz' --pattern '*checksums.txt'
          sha256sum --ignore-missing -c ./*checksums.txt
          tar xzf ./*_linux_amd64.tar.gz carapace
          echo "$RUNNER_TEMP/carapace" >> "$GITHUB_PATH"

      - name: Run tests
        shell: pwsh
        run: ./tests/Test-PwshUnixBridge.ps1

      - name: The shipped profile loads the module
        shell: pwsh
        run: |
          $env:PSModulePath = "$PWD$([IO.Path]::PathSeparator)$env:PSModulePath"
          . ./.config/powershell/profile.ps1
          if (-not (Get-Module PwshUnixBridge)) { throw 'profile did not load PwshUnixBridge' }
          "loaded PwshUnixBridge $((Get-Module PwshUnixBridge).Version)"
