---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning, Error
          $results | Format-Table -AutoSize -Wrap ScriptName, Line, Severity, RuleName, Message
          foreach ($r in $results) {
            "::$($r.Severity -eq 'Error' ? 'error' : 'warning') file=$($r.ScriptPath | Resolve-Path -Relative),line=$($r.Line)::$($r.RuleName): $($r.Message)"
          }
          if ($results) { throw "PSScriptAnalyzer reported $($results.Count) issue(s)" }

  test:
    name: Profile tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nano and Microsoft.PowerShell.UnixTabCompletion
        shell: pwsh
        run: |
          if (-not (Get-Command nano -ErrorAction SilentlyContinue)) {
            sudo apt-get install -y nano
          }
          Install-Module Microsoft.PowerShell.UnixTabCompletion -Scope CurrentUser -Force -AcceptLicense

      - name: Run tests
        shell: pwsh
        run: ./tests/Test-Profile.ps1
